# Builds the site on every push to main and publishes it to GitHub Pages.
# Pull requests are built too (without publishing), so a broken page shows
# up as a red X on the PR before you merge it.
name: Build and deploy site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read GitHub Pages settings
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Build site
        run: npm run build
        env:
          # '' with a custom domain, '/<repo>' on <user>.github.io/<repo>
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # While Settings → Pages → Source is "Deploy from a branch", GitHub also
      # publishes the raw repository (the README) on every push, and whichever
      # deployment finishes last is what visitors see. Wait for that build so
      # this one always lands last. With Source = "GitHub Actions" there is
      # nothing to wait for and this step ends at once.
      - name: Wait for GitHub's own Pages build, if any
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            pending=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=20" \
              --jq '[.workflow_runs[] | select(.name == "pages build and deployment" and .status != "completed")] | length')
            if [ "$pending" = "0" ]; then
              exit 0
            fi
            echo "GitHub's own Pages build is still running, waiting 10 s..."
            sleep 10
          done
          echo "Gave up waiting after 5 minutes, deploying anyway."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
